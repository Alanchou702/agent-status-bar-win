<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>:root{--active:#2ed26a}*{box-sizing:border-box}html,body{margin:0;width:112px;height:72px;background:transparent;overflow:hidden;-webkit-app-region:drag}.housing{width:104px;height:64px;margin:4px;border-radius:18px;background:linear-gradient(145deg,#232a30,#0e1216);border:1px solid rgba(255,255,255,.34);box-shadow:0 7px 20px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;gap:10px}.lamp{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.04);position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}.lamp.active{background:currentColor;box-shadow:0 0 12px currentColor,inset 0 1px rgba(255,255,255,.5)}.lamp.active:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);left:3px;top:2px}.red{color:#f04443}.yellow{color:#f8bd35}.green{color:#2ed26a}.flash{animation:pulse 1.05s infinite ease-in-out}.fast{animation:pulse .48s infinite ease-in-out}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="housing"><i class="lamp red"></i><i class="lamp yellow"></i><i class="lamp green active"></i></div><script>const{ipcRenderer}=require('electron');function apply(s){document.querySelectorAll('.lamp').forEach(x=>{x.classList.remove('active','flash','fast')});let state=s.state||'idle',lamp=state==='blocked'||state==='permission'||state==='approval'?'red':state==='attention'||state==='unknown'?'yellow':'green';let el=document.querySelector('.lamp.'+lamp);if(!el)return;el.classList.add('active');if(state==='busy'||state==='working')el.classList.add('flash');if(state==='blocked'||state==='permission'||state==='approval')el.classList.add('fast')}ipcRenderer.on('light-state',(_,s)=>apply(s));</script></body></html>
