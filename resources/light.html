<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --status-color: #969696; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 60px;
      height: 55px;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
      cursor: move;
    }
    #avatar {
      position: relative;
      width: 112px;
      height: 106px;
      transform: scale(.5);
      transform-origin: 0 0;
      filter: drop-shadow(0 7px 5px rgba(0,0,0,.32));
    }
    #aura {
      position: absolute;
      z-index: 0;
      left: 18px;
      top: 9px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--status-color);
      opacity: .35;
      filter: blur(13px);
      transition: background .2s ease;
    }
    #body {
      position: absolute;
      z-index: 1;
      left: 31px;
      top: 70px;
      width: 53px;
      height: 34px;
      border: 2px solid rgba(255,255,255,.2);
      border-radius: 22px 22px 12px 12px;
      background: linear-gradient(145deg, #32343b, #111217);
      box-shadow: inset 7px 5px 8px rgba(255,255,255,.11), inset -7px -6px 10px rgba(0,0,0,.4);
    }
    #collar {
      position: absolute;
      left: 19px;
      top: -1px;
      width: 15px;
      height: 21px;
      border-radius: 3px 3px 10px 10px;
      background: #f19a31;
      transform: rotate(22deg);
    }
    #terminal-mark {
      position: absolute;
      right: 9px;
      top: 13px;
      color: #ffad45;
      font: 700 10px/1 monospace;
      opacity: .9;
    }
    #head {
      position: absolute;
      z-index: 2;
      left: 23px;
      top: 17px;
      width: 69px;
      height: 63px;
      border: 2px solid rgba(255,255,255,.68);
      border-radius: 45% 48% 48% 48%;
      background: linear-gradient(145deg, #fff5dc 0%, #f6d09b 62%, #c98a57 100%);
      box-shadow: inset 7px 5px 8px rgba(255,255,255,.52), inset -8px -7px 10px rgba(92,48,28,.22);
    }
    #hair {
      position: absolute;
      z-index: 3;
      left: 17px;
      top: 6px;
      width: 78px;
      height: 37px;
      background: #ed8c2f;
      clip-path: polygon(2% 74%, 12% 39%, 20% 47%, 23% 5%, 35% 29%, 48% 0, 56% 28%, 74% 7%, 71% 35%, 95% 22%, 84% 61%, 100% 70%, 73% 79%, 43% 67%, 19% 83%);
      filter: drop-shadow(1px 2px 1px rgba(80,34,14,.42));
      transform: rotate(-5deg);
    }
    #hair::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 8px;
      width: 37px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,218,133,.55);
      transform: rotate(-12deg);
    }
    .eye {
      position: absolute;
      z-index: 4;
      top: 36px;
      width: 18px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(86,45,30,.5);
      box-shadow: inset 0 -2px 2px rgba(130,70,42,.18);
      transition: transform .15s ease;
    }
    .eye::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 4px;
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background: #272435;
      box-shadow: 1px 0 0 1px rgba(255,255,255,.6);
    }
    #eye-left { left: 13px; }
    #eye-right { right: 13px; }
    .brow {
      position: absolute;
      z-index: 4;
      top: 31px;
      width: 20px;
      height: 4px;
      border-radius: 50%;
      background: #7c492b;
    }
    #brow-left { left: 11px; transform: rotate(9deg); }
    #brow-right { right: 11px; transform: rotate(-9deg); }
    #nose {
      position: absolute;
      z-index: 4;
      left: 32px;
      top: 47px;
      width: 7px;
      height: 9px;
      border-right: 2px solid rgba(123,67,40,.68);
      border-bottom: 2px solid rgba(123,67,40,.68);
      border-radius: 0 0 8px 0;
      transform: rotate(12deg);
    }
    #mouth {
      position: absolute;
      z-index: 4;
      left: 28px;
      top: 61px;
      width: 18px;
      height: 8px;
      border-bottom: 2px solid #6f302d;
      border-radius: 50%;
      transition: all .15s ease;
    }
    .cheek {
      position: absolute;
      z-index: 4;
      top: 55px;
      width: 10px;
      height: 5px;
      border-radius: 50%;
      background: rgba(237,103,102,.45);
      filter: blur(1px);
    }
    #cheek-left { left: 5px; }
    #cheek-right { right: 5px; }
    .blink .eye { transform: scaleY(.12); }
    .active #avatar { animation: mini-float 1.2s ease-in-out infinite; }
    .active #aura { animation: aura-pulse 1.2s ease-in-out infinite; }
    .approval #brow-left { transform: rotate(-18deg) translateY(3px); }
    .approval #brow-right { transform: rotate(18deg) translateY(3px); }
    .approval #mouth { height: 9px; border-bottom: 0; border-top: 2px solid #6f302d; }
    .running .eye::after { animation: glance 3s ease-in-out infinite; }
    .funny #head { animation: silly .7s ease-in-out 1; }
    .funny #mouth { transform: rotate(-15deg) scaleX(1.35); border-bottom-width: 3px; }
    .funny #brow-left { transform: rotate(26deg) translateY(-3px); }
    .funny #brow-right { transform: rotate(-25deg) translateY(3px); }
    @keyframes mini-float { 0%,100% { transform: scale(.5) translateY(0) rotate(-1deg); } 50% { transform: scale(.5) translateY(-4px) rotate(1deg); } }
    @keyframes aura-pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .55; transform: scale(1.16); } }
    @keyframes glance { 0%,65%,100% { transform: translateX(0); } 78% { transform: translateX(3px); } 88% { transform: translateX(-2px); } }
    @keyframes silly { 0%,100% { transform: rotate(0) scale(1); } 35% { transform: rotate(-7deg) scale(1.06,.95); } 70% { transform: rotate(7deg) scale(.95,1.06); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="avatar">
    <div id="aura"></div>
    <div id="body"><div id="collar"></div><span id="terminal-mark">&gt;_</span></div>
    <div id="hair"></div>
    <div id="head">
      <div class="brow" id="brow-left"></div><div class="brow" id="brow-right"></div>
      <div class="eye" id="eye-left"></div><div class="eye" id="eye-right"></div>
      <div id="nose"></div><div id="mouth"></div>
      <div class="cheek" id="cheek-left"></div><div class="cheek" id="cheek-right"></div>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const avatar = document.getElementById('avatar');
    const root = document.documentElement;
    let blinkTimer;
    function applyState(state) {
      const color = state.color || '#969696';
      root.style.setProperty('--status-color', color);
      avatar.className = '';
      if (state.blink) avatar.classList.add('active', 'blink');
      if (/ff4d4f|ff0000/i.test(color)) avatar.classList.add('approval');
      else if (/3cc85a|00ff00/i.test(color)) avatar.classList.add('busy');
      else if (/4682ff|0000ff/i.test(color)) avatar.classList.add('running');
    }
    function blink() {
      avatar.classList.add('blink');
      clearTimeout(blinkTimer);
      blinkTimer = setTimeout(() => avatar.classList.remove('blink'), 180);
    }
    ipcRenderer.on('light-state', (_event, state) => applyState(state));
    setInterval(() => { if (!avatar.classList.contains('blink')) blink(); }, 4200 + Math.random() * 3500);
    setInterval(() => {
      avatar.classList.add('funny');
      setTimeout(() => avatar.classList.remove('funny'), 700);
    }, 9000 + Math.random() * 8000);
  </script>
</body>
</html>
