<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Agent Signal Bar</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="floating.css">
  <script defer src="floating.js"></script>
  <script defer src="panel.js"></script>
</head>
<body>
<div id="floating-compact" title="按住拖动"><div class="housing" id="housing" data-state="idle"><div class="floating-agent" id="floating-claude"><img src="claude.png" alt=""><span class="floating-name">Claude Code</span><span class="floating-state">连接中</span></div><span class="divider" aria-hidden="true"></span><div class="floating-agent" id="floating-codex"><img src="codex.png" alt=""><span class="floating-name">Codex</span><span class="floating-state">连接中</span></div></div></div>
<main class="panel">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Agent Signal Bar</span></div>
    <div class="window-actions"><button class="icon-button" id="settings-open" title="设置" aria-label="打开设置">⚙</button><button class="icon-button" id="close" title="收起面板" aria-label="收起面板">×</button></div>
  </header>
  <div class="tabs" role="tablist" aria-label="面板视图">
    <button id="overview-tab" role="tab" aria-selected="true" aria-controls="overview" class="tab selected">状态总览</button>
    <button id="activity-tab" role="tab" aria-selected="false" aria-controls="activity" class="tab">活动记录 <span id="event-count">0</span></button>
    <span class="connection" id="connection">连接中</span>
  </div>
  <div class="content">
    <section id="overview" role="tabpanel" aria-labelledby="overview-tab">
      <div class="status-hero" id="hero" data-state="idle">
        <div class="eyebrow"><span class="live-dot"></span><span id="mode">本机监控</span><span id="live-time" class="timestamp">首次扫描中</span></div>
        <div class="hero-line"><h1 id="status-label">正在连接</h1><div class="signal-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
        <p id="status-description">正在读取本机 Agent 的运行状态。</p>
      </div>
      <div id="error" class="notice error" role="alert" hidden></div>
      <div id="scan-warning" class="notice" hidden></div>
      <div id="demo-notice" class="notice" hidden>正在预览模拟状态，8 秒后恢复真实监控。</div>
      <div class="section-heading"><h2>你的 Agents</h2><span id="agent-count">自动发现</span></div>
      <div id="agents" class="agent-list"></div>
      <details id="codex-sessions" class="session-section" open hidden>
        <summary>Codex 会话 <span id="session-total"></span></summary>
        <div class="session-controls"><input id="session-search" type="search" placeholder="搜索会话或项目" aria-label="搜索 Codex 会话"><select id="session-filter" aria-label="筛选 Codex 会话"><option value="active">活跃会话</option><option value="attention">需要处理</option><option value="all">全部会话</option></select></div>
        <div id="session-list" class="session-list"></div>
        <div id="session-count" class="session-count"></div>
      </details>
      <div class="credit-section" id="credit-section" hidden>
        <div class="section-heading"><h2>Claude 剩余额度</h2><span id="credit-note"></span></div>
        <div id="credits"></div>
      </div>
      <div class="last-event" id="last-event"><span class="quiet-dot"></span><span>状态发生变化时，活动记录会自动更新。</span></div>
    </section>
    <section id="activity" role="tabpanel" aria-labelledby="activity-tab" hidden>
      <div class="page-heading"><h1>活动记录</h1><p>本次运行期间的状态变化 · 最多保留 40 条</p></div>
      <div id="events" class="timeline"></div>
    </section>
    <section id="settings" hidden>
      <div class="page-heading"><button id="settings-back" class="back-button">← 返回总览</button><h1>设置</h1><p>按你的工作节奏调整监控。</p></div>
      <form id="settings-form">
        <label class="setting-row"><span><strong>桌面信号灯</strong><small>始终置顶，可拖动到任意屏幕</small></span><input type="checkbox" name="lightEnabled" role="switch"></label>
        <label class="setting-row"><span><strong>系统通知</strong><small>需要审批、输入或任务完成时提醒</small></span><input type="checkbox" name="notificationsEnabled" role="switch"></label>
        <label class="setting-row"><span><strong>状态提示音</strong><small>审批、输入、完成和异常时播放不同提示音</small></span><input type="checkbox" name="soundEnabled" role="switch"></label>
        <label class="setting-row"><span><strong>工作时防止睡眠</strong><small>等待操作或暂停监控时自动释放</small></span><input type="checkbox" name="keepAwakeEnabled" role="switch"></label>
        <label class="setting-row"><span><strong>登录时启动</strong><small>Windows 登录后在托盘中运行</small></span><input type="checkbox" name="openAtLogin" role="switch"></label>
        <label class="setting-row"><span><strong>显示 Claude 额度</strong><small>使用本机 Claude 登录信息查询</small></span><input type="checkbox" name="creditEnabled" role="switch"></label>
        <label class="setting-row"><span><strong>刷新间隔</strong><small>间隔越短，扫描越频繁</small></span><span class="number-field"><input name="scanIntervalSec" type="number" min="2" max="60" required aria-label="刷新间隔，秒"><span>秒</span></span></label>
        <div class="save-row"><span id="save-message" role="status"></span><button type="submit" class="button primary" id="save-settings">保存设置</button></div>
      </form>
    </section>
  </div>
  <footer>
    <div class="toolbar"><button id="pause" class="button primary">暂停监控</button><button id="refresh" class="button">↻ 刷新</button><button id="quit" class="text-button">退出</button></div>
    <div class="footnote"><span id="footnote">仅监控本机 Agent</span><span>Windows · v0.4</span></div>
  </footer>
</main>
</body>
</html>
