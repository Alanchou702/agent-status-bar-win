<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#f4f6f8;background:transparent;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{padding:8px}.panel{width:100%;height:100%;border:1px solid rgba(255,255,255,.23);border-radius:22px;background:linear-gradient(145deg,rgba(38,58,70,.96),rgba(20,31,39,.94) 58%,rgba(41,44,49,.92));box-shadow:0 16px 42px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.12);overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(24px)}
.scroll{padding:18px 16px 12px;overflow:auto;flex:1}.header{display:flex;gap:12px;align-items:flex-start}.brand{font-size:13px;font-weight:650;color:#aeb9c1;margin:1px 0 2px}.state{font-size:26px;line-height:1.05;font-weight:700;letter-spacing:.2px}.action{font-size:15px;font-weight:650;color:#aeb9c1;margin-top:3px}.summary{font-size:15px;font-weight:600;line-height:1.35;margin-top:22px}.meta{color:#98a5ac;font-size:12px;margin-top:8px}.section-title{color:#aeb9c1;font-size:12px;font-weight:700;margin:18px 0 8px}.row{display:flex;gap:9px;align-items:flex-start;padding:5px 0}.dot{width:8px;height:8px;border-radius:50%;margin:5px 1px 0 0;flex:0 0 auto;background:#2ed26a;box-shadow:0 0 8px currentColor}.row-main{min-width:0;flex:1}.row-top{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:12px;color:#a2adb3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-time{font-size:11px;color:#89959c;margin-top:2px}.divider{height:1px;background:rgba(255,255,255,.13);margin:8px 0 0}.actions{padding:11px 16px 12px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{height:34px;border:1px solid rgba(255,255,255,.24);border-radius:9px;background:rgba(255,255,255,.055);color:#f2f4f5;font:650 14px "Segoe UI";display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.btn:hover{background:rgba(255,255,255,.13)}.quit{margin:10px 1px 0 auto;border:0;background:transparent;color:#b5bdc1;font:600 13px "Segoe UI";cursor:pointer;display:flex;gap:7px;align-items:center}.signal{display:flex;gap:8px;padding:5px 0 0 1px}.lamp{width:18px;height:18px;border-radius:50%;border:1px solid rgba(235,245,246,.72);background:rgba(255,255,255,.035);box-shadow:0 0 5px rgba(255,255,255,.05)}.lamp.active{border-color:currentColor;background:currentColor;box-shadow:0 0 12px currentColor}.lamp.red{color:#f04443}.lamp.yellow{color:#f8bd35}.lamp.green{color:#2ed26a}.lamp.flash{animation:flash 1.05s ease-in-out infinite}.lamp.fast{animation:flash .48s ease-in-out infinite}@keyframes flash{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
</style></head>
<body><div class="panel"><div class="scroll"><div class="header"><div id="signal" class="signal"><i class="lamp red"></i><i class="lamp yellow"></i><i class="lamp green"></i></div><div><div class="brand">Agent Signal Bar</div><div id="state" class="state">空闲</div><div id="action" class="action">无需处理</div></div></div><div id="summary" class="summary">等待本地 Agent 状态。</div><div id="meta" class="meta">等待状态</div><div id="sessions"></div><div id="events"></div></div><div class="actions"><div class="divider"></div><div class="action-grid"><button id="pause" class="btn">Ⅱ&nbsp;&nbsp;暂停监控</button><button id="settings" class="btn">⚙&nbsp;&nbsp;设置</button></div><button id="quit" class="quit">◯&nbsp;&nbsp;退出</button></div></div>
<script>
const {ipcRenderer}=require('electron');const $=id=>document.getElementById(id);let paused=false;
const names={idle:['空闲','无需处理','当前无需关注','#2ed26a'],running:['运行中','不用处理','Agent 进程正在运行。','#2ed26a'],busy:['工作中','不用处理','Agent 正在读写文件、跑工具或测试。','#2ed26a'],unknown:['状态不可信','请检查','本地状态不可用或无法读取。','#f8bd35']};
function fmt(t){return t?new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—'}
function setLamps(state){document.querySelectorAll('.lamp').forEach(x=>{x.classList.remove('active','flash','fast')});const s=state==='busy'||state==='running'?'green':state==='unknown'?'yellow':'green';const lamp=document.querySelector('.lamp.'+s);lamp.classList.add('active');if(state==='busy')lamp.classList.add('flash');if(state==='unknown')lamp.classList.add('fast')}
function render(data){const snaps=data.summary?.snapshots||[];paused=data.paused;const state=snaps.some(s=>s.state==='busy')?'busy':snaps.some(s=>s.state==='running')?'running':snaps.some(s=>s.state==='unknown')?'unknown':'idle';const n=names[state];$('state').textContent=paused?'已暂停':n[0];$('action').textContent=paused?'监控已暂停':n[1];$('summary').textContent=paused?'监控已暂停。':n[2];$('meta').textContent=snaps.length?`实时 ${fmt(data.summary.scannedAt)}`:'等待状态';$('pause').innerHTML=paused?'▶&nbsp;&nbsp;继续监控':'Ⅱ&nbsp;&nbsp;暂停监控';setLamps(paused?'idle':state);$('sessions').innerHTML=snaps.length?'<div class="section-title">当前会话</div>'+snaps.map(s=>{const title=s.client==='claude'?'Claude Code':'Codex';const detail=s.detail||'正在运行';return `<div class="row"><span class="dot" style="background:${s.state==='unknown'?'#f8bd35':'#2ed26a'}"></span><div class="row-main"><div class="row-top">${title}</div><div class="row-sub">${detail}</div></div><span class="row-time">${fmt(s.scannedAt)}</span></div>`}).join(''):'<div class="section-title">当前会话</div><div class="row-sub">暂无运行中的 Agent</div>';$('events').innerHTML='<div class="section-title">最近</div>'+[...snaps,...snaps,...snaps].slice(0,3).map((s,i)=>`<div class="row"><span class="dot"></span><div class="row-main"><div class="row-top">${s.client==='claude'?'Claude Code':'Codex'}</div><div class="row-sub">${s.detail||['状态更新','活动检查','任务完成'][i]}</div></div><span class="row-time">${fmt(s.scannedAt)}</span></div>`).join('')}
$('pause').onclick=()=>ipcRenderer.send('panel-action','toggle-monitoring');$('settings').onclick=()=>ipcRenderer.send('panel-action','open-settings');$('quit').onclick=()=>ipcRenderer.send('panel-action','quit');ipcRenderer.on('panel-state',(_,data)=>render(data));
</script></body></html>
